name: Release

# A tag `<pack>@<version>` (for example `foundation@1.0.0`) releases one pack:
# the tag must agree with the pack's pwpack.json, the whole pipeline must be
# green, and the engine's writer produces the `.pwpack`, which is attached to
# a GitHub Release with its sha256 — the release the tag was cut with from the
# web, or a new one when the tag was pushed.

on:
  push:
    tags: ['*@*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve the pack and version from the tag
        id: tag
        run: |
          # <pack>@<major.minor.patch> and nothing else: the name reaches a path and a shell.
          if [[ ! "$GITHUB_REF_NAME" =~ ^([a-z0-9][a-z0-9-]*)@([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "tag '$GITHUB_REF_NAME' is not <pack>@<major.minor.patch>"; exit 1
          fi
          pack="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          # A release is cut from what main carries, never from an unmerged commit.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main"; exit 1; }
          file="packs/$pack/pwpack.json"
          test -f "$file" || { echo "no pack '$pack' (no $file)"; exit 1; }
          declared=$(node -p "require('./$file').version")
          test "$declared" = "$version" || { echo "tag says $version, $file says $declared"; exit 1; }
          echo "pack=$pack" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build ${{ steps.tag.outputs.pack }}

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACK: ${{ steps.tag.outputs.pack }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          files=("dist/$PACK-$VERSION.pwpack" "dist/$PACK-$VERSION.pwpack.sha256")
          # A maintainer may cut the tag from the web, which opens the release
          # with it: then the archive is attached to that release.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            name="$(node -p "require('./packs/$PACK/pwpack.json').name ?? '$PACK'")"
            gh release create "$GITHUB_REF_NAME" \
              --title "$name $VERSION" \
              --generate-notes \
              "${files[@]}"
          fi
