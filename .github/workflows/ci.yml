name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the packs declare and how they hang together: the pack map, each
  # pack's integrity, fabricated references, imports a host does not provide,
  # and the engine's own validation of every pack folder.
  check:
    name: check + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm validate
      # The .pwpack archives a release attaches, written here too, so a pack
      # that cannot be packed fails on its pull request, not on its tag.
      - run: pnpm build

  # The packs declare their engine range in pack-map.json (defaults.engines);
  # the engine they are typechecked and tested on is the one package.json pins.
  engine:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm typecheck
      - run: pnpm test

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The action lists the PR's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # As the engine repository does: the action carries commitlint and the
      # conventional config, which `npx -p …` could not resolve from the repo.
      - name: Validate PR commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  # One required status check for branch protection.
  ci:
    name: ci
    if: always()
    needs: [check, engine, commitlint]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs green
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const bad = Object.entries(JSON.parse(s)).filter(([, j]) => !["success", "skipped"].includes(j.result));
              for (const [id, j] of Object.entries(JSON.parse(s))) console.log(`${id}: ${j.result}`);
              if (bad.length) process.exit(1);
            })'
